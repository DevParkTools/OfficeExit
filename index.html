<!DOCTYPE html>
<html lang="ko">
<head>

<title>칼퇴 러쉬 🏃</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#101826;color:#fff;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}

.ov::before,.ov::after{content:"";flex:1 0 0}

button:active{transform:scale(.96)}
button.s{background:rgba(255,255,255,.16);box-shadow:none}
button:focus-visible{outline:3px solid #fff}
button,canvas{cursor:pointer}
@media (hover:hover){button:hover{filter:brightness(1.12)}}
@media (min-width:700px){h1{font-size:46px}.sub{font-size:19px}.st{font-size:15px}button{font-size:20px}}
#pb{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:44px;height:44px;padding:0;margin:0;border-radius:50%;font-size:18px;background:rgba(255,255,255,.18);box-shadow:none;z-index:5}

</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<button id="pb" class="hide" aria-label="일시정지">⏸</button>

<div class="ov" id="menu">
  <h1>칼퇴 러쉬 🏃</h1>
  <p class="sub">6시 전에 문까지 달려가요<br><b>꾹 누르면</b> 달리고 · <b>손 떼면</b> 일하는 척<br>부장님이 돌아볼 때 움직이면 걸려요 👀</p>
  <div><button id="go">시작하기</button></div>
  <p class="st">☕ 부스트 · 🎫 연차(1회 방어) · ⏰ 시간 추가<br>❗ 경고 중에 달리면 🔥 아슬아슬 보너스<br>PC: 스페이스바 / 마우스 꾹 · Esc 일시정지</p>
  <p class="st" id="ms"></p>
</div>
<div class="ov hide" id="pz">
  <h1>⏸ 일시정지</h1>
  <div><button id="rs">▶ 계속하기</button></div>
  <div><button id="qm" class="s">🏠 메뉴로</button></div>
  <p class="st">메뉴로 나가면 이번 판은 기록되지 않아요</p>
</div>
<div class="ov hide" id="over">
  <div class="ttl" id="ot"></div>
  <div class="big" id="os"></div>
  <p class="q" id="oq"></p>
  <p class="st" id="ob"></p>
  <div><button id="re">다시 도전</button><button id="sh" class="s">공유하기</button></div>
  <div><button id="mn" class="s">메뉴</button></div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const SPEED=.2;
const TI=[[0,'신입 인턴 😵','출근한 것만 해도 대단해요'],[1,'눈치 보는 막내 🐣','일단 한 번은 퇴근했어요'],[3,'눈치 만렙 사원 👀','부장님 레이더를 피했어요'],[5,'칼퇴 장인 🏃','6시 땡은 당연한 사람'],[8,'닌자 대리 🥷','기척이 없어요'],[12,'퇴근의 신 👑','부장님이 존경합니다'],[18,'전설의 칼퇴왕 🏆','회사가 당신을 못 잡아요']];
const ti=n=>{let t=0;TI.forEach((a,i)=>{if(n>=a[0])t=i});return t};
const BN=['팀장님','부장님','상무님','사장님','회장님'];
const bi=n=>n<=3?0:n<=6?1:n<=9?2:n<=14?3:4;
const THEMES=[
{n:'사무실',e:'🏢',win:1,wall:'#2b3550',sky:'sunset',fs:'tile',fl:'#3a3f52',fl2:'#4a5068',decor:['🪴','🗄️','🖨️','🚰','☕','📦','🪑'],far:[],door:'퇴근',idle:'🧑‍💻',say:'타닥타닥…',pre:'일하는 척…',bn:'팀장님',b:['🧑‍💼','🤨','😡'],prop:'💻',desk:['#7a5a3a','#5f4429'],caught:['"어디 가나?"','"잠깐 나 좀 보지"','"퇴근 전에 하나만…"']},
{n:'해적선',e:'🏴‍☠️',win:0,sky:'sunset',fs:'planks',fl:'#6b4a2f',fl2:'#8a6240',decor:['🛢️','⚓','📦','🦜','💰','🧭','🪵'],far:['⛵','🏝️','🌊','🏴‍☠️'],door:'항구',idle:'🧍',say:'콜록… 럼주 한잔',pre:'갑판 닦는 척…',bn:'해적 선장',b:['🧔','🤨','😡'],prop:'🍾',desk:['#5a3b22','#3f2915'],caught:['"어딜 도망가나, 풋내기!"','"닻 올리기 전엔 못 간다!"','"갑판 청소 아직이다!"']},
{n:'퇴근길 도로',e:'🛣️',win:0,sky:'sunset',fs:'road',fl:'#363a45',fl2:'#9aa0ad',decor:['🚗','🚌','🚦','🌳','🚧','🛵','🚕'],far:['🏙️','🏢','🌆'],door:'집',idle:'🧍',say:'호루라기 삑—',pre:'신호 기다리는 척…',bn:'교통경찰',b:['👮','🤨','😡'],prop:'🚓',desk:['#4b5160','#323744'],caught:['"신호 위반입니다!"','"면허증 좀 볼까요?"','"무단횡단 하셨죠?"']},
{n:'우주정거장',e:'🚀',win:0,sky:'space',fs:'tile',fl:'#2d3550',fl2:'#4b5a86',decor:['🛰️','🪐','☄️','👽','🔭','🧑‍🚀','📡'],far:['🪐','🌍','🌙','⭐'],door:'지구행',idle:'🧍',say:'삐빅… 교신 중',pre:'점검하는 척…',bn:'우주사령관',b:['👨‍🚀','🤨','😡'],prop:'📡',desk:['#47547d','#2f3a5c'],caught:['"교신 두절이다!"','"무중력 훈련 더 해라!"','"지구 귀환 허가 못 냈다!"']},
{n:'공사장',e:'🚧',win:0,sky:'sunset',fs:'hazard',fl:'#7a5c3e',fl2:'#222222',decor:['🏗️','🧱','🚧','🛢️','📦','🚜','🪜'],far:['🏗️','🏢','🏭'],door:'퇴근',idle:'🧍',say:'쿵쾅쿵쾅!',pre:'벽돌 나르는 척…',bn:'현장소장',b:['👷','🤨','😡'],prop:'📐',desk:['#c28a2c','#8a6016'],caught:['"안전모 써라!"','"작업 안 끝났다!"','"어디 가나, 자재 옮겨라!"']},
{n:'놀이공원',e:'🎡',win:0,sky:'sunset',fs:'tile',fl:'#c9a27a',fl2:'#e0bd96',decor:['🎠','🎈','🍿','🎪','🎟️','🍭','🎢'],far:['🎡','🎢','🎪'],door:'출구',idle:'🧍',say:'꺄르르~',pre:'풍선 부는 척…',bn:'어트랙션 직원',b:['🤡','🤨','😡'],prop:'🎈',desk:['#e0527a','#b03358'],caught:['"줄 서세요~!"','"키 확인 좀 할게요!"','"어트랙션 아직 안 끝났어요!"']},
{n:'설산',e:'⛄',win:0,sky:'snow',fs:'snow',fl:'#e8f0f7',fl2:'#ffffff',decor:['⛄','🌲','⛷️','🛷','🎿','🧣','🌨️'],far:['🏔️','🌲','⛰️'],door:'산장',idle:'🧍',say:'으르렁… zzz',pre:'눈사람 만드는 척…',bn:'북극곰',b:['🐻‍❄️','🤨','😡'],prop:'🐟',desk:['#cfe1ee','#a9c4d6'],caught:['"크아앙! 어딜 가!"','"내 구역이다!"','"눈싸움 한 판 하자!"']},
{n:'학교',e:'🏫',win:1,wall:'#3a4a3a',sky:'sunset',fs:'tile',fl:'#8b6a45',fl2:'#a47f55',decor:['🎒','📚','🪑','🖍️','🎨','🧪','📏'],far:[],door:'하교',idle:'🧑‍🎓',say:'채점 중…',pre:'공부하는 척…',bn:'교감선생님',b:['🧑‍🏫','🤨','😡'],prop:'📖',desk:['#9c7a55','#75583a'],caught:['"어디 가니? 수업 안 끝났다!"','"숙제 검사 하자!"','"교무실로 따라와라!"']}
];
const STARS=Array.from({length:40},()=>({x:Math.random()*340,y:Math.random(),r:.6+Math.random()*1.4}));
const CAUGHT=['"어디 가나?"','"잠깐 나 좀 보지"','"오늘 일찍 가네?"','"이거 내일까지 가능하지?"','"퇴근 전에 하나만…"'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

let V={best:0,bestScore:0,games:0};
try{Object.assign(V,JSON.parse(localStorage.getItem('kal1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('kal1',JSON.stringify(V))}catch(e){}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

let lw=0,lh=0,s=1,LW=360,LH=640,dpr=1,offX=0,IL=14,IR=14,IT=8,IB=8,SC={top:0,h:0,gy:0,bot:0};const EM={};
function resize(){
  const W=innerWidth||360,H=innerHeight||640;lw=innerWidth;lh=innerHeight;
  dpr=Math.max(.75,Math.min(devicePixelRatio||1,2,2400/Math.max(W,H)));cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  s=Math.min(W/360,H/560);LH=H/s;offX=(W/s-360)/2;
  const cs=getComputedStyle($('sa'));
  IT=(parseFloat(cs.paddingTop)||0)/s+8;IB=(parseFloat(cs.paddingBottom)||0)/s+8;
  SC.top=IT+100;SC.h=Math.max(230,Math.min(330,LH*.44));SC.bot=SC.top+SC.h;SC.gy=SC.top+SC.h*.74;
  for(const k in EM)delete EM[k];
}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();
function sprite(e,sz){
  const k=e+'|'+sz+'|'+(s*dpr).toFixed(2);if(EM[k])return EM[k];
  const z=Math.max(4,Math.ceil(sz*s*dpr)),c=document.createElement('canvas');c.width=c.height=z;
  const x=c.getContext('2d');x.font=(z*.8)+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,z/2,z/2+z*.04);
  return EM[k]=c;
}
function emo(e,x,y,sz){ctx.drawImage(sprite(e,sz),x-sz/2,y-sz/2,sz,sz)}
function emoF(e,x,y,sz,fl){if(!fl){emo(e,x,y,sz);return}ctx.save();ctx.translate(x,y);ctx.scale(-1,1);emo(e,0,0,sz);ctx.restore()}
/* 이모지 폰트마다 달리는 방향이 달라서, 실제로 그려보고 오른쪽(문 쪽)을 보게 자동 보정 */
function detectRun(){
  try{
    const z=96,c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d');
    x.font='78px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🏃',z/2,z/2);
    const d=x.getImageData(0,0,z,z).data;let tx=0,tn=0,bx=0,bn=0;
    for(let y=0;y<z;y++)for(let xx=0;xx<z;xx++){const a=d[(y*z+xx)*4+3];if(a<40)continue;if(y<z*.42){tx+=xx*a;tn+=a}else if(y>z*.62){bx+=xx*a;bn+=a}}
    if(tn>0&&bn>0){const dd=tx/tn-bx/bn;if(Math.abs(dd)>1)runFlip=dd<0}
  }catch(e){}
}

let ac;
function beep(f,d,type){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}
}

const D=3200,SKY=[[0,[127,208,255]],[.55,[255,190,90]],[.85,[255,94,98]],[1,[45,27,78]]];
let decor=[],far=[],TH=THEMES[0];
function mkDecor(){TH=THEMES[(stage-1)%THEMES.length];decor=[];far=[];for(let x=300;x<D-140;x+=260+Math.random()*200)decor.push({x,e:pick(TH.decor)});if(TH.far.length)for(let x=40;x<D*.222+420;x+=300+Math.random()*180)far.push({x,e:pick(TH.far)})}
let score=0,gain=0,runFlip=false,dust=[],dustT=0;
let boost=0,shield=false,risk=0,items=[],fl=[],overAt=0;
let st='menu',paused=false,stage=1,cleared=0,prog=0,t=0,T=14,bs='away',bt=0,bd=1.5,fake=false,fakeT=0,holds=new Set(),moving=false,stepT=0,parts=[],shake=0,flash=0,why='',endKind='',msgT=0,msg='',tm=0,newBest=false,lastT=0;

function setB(x){
  bs=x;bt=0;const f=Math.max(.5,1-.04*stage);
  if(x==='away')bd=(1.1+Math.random()*1.3)*f;
  else if(x==='warn'){bd=Math.max(.28,.55-.02*stage);fake=stage>=4&&Math.random()<.2}
  else bd=.7+Math.random()*.6;
}
function mkItems(){items=[];const ty=['☕','☕','⏰','🎫'];let x=520;while(x<D-300){let y=x;while(decor.some(d=>Math.abs(d.x-y)<90))y+=25;items.push({x:y,e:pick(ty),got:false});x=y+520+Math.random()*320}}
function pop(tx,c){fl.push({tx,x:104,y:SC.gy-80,l:1.4,c})}
function grab(e){
  if(e==='☕'){boost=3;pop('☕ 부스트!','#ffb86b');beep(660,.1,'triangle')}
  else if(e==='🎫'){shield=true;pop('🎫 연차 획득!','#7dd3fc');beep(760,.1,'triangle')}
  else{T+=2.5;pop('⏰ +2.5초','#86efac');beep(900,.1,'triangle')}
  burst(58,SC.gy-30,[e,'✨'],5);score+=30;if(navigator.vibrate)navigator.vibrate(10);
}
function startStage(){
  mkDecor();mkItems();boost=0;risk=0;prog=0;t=0;T=Math.max(14,24-.5*stage);parts=[];fakeT=0;msgT=0;tm=0;setB('away');bd=Math.max(bd,1.4);st='ready';
}
function startGame(){try{document.activeElement.blur()}catch(e){}
  stage=Math.max(1,parseInt(new URLSearchParams(location.search).get('stage'))||1);cleared=0;score=0;gain=0;dust=[];fl=[];shield=false;boost=0;risk=0;holds.clear();paused=false;
  ['menu','pz','over'].forEach(i=>$(i).classList.add('hide'));$('pb').classList.remove('hide');
  startStage();
}
function burst(x,y,list,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*8,vy:-Math.random()*6-2,l:1,e:pick(list)})}
function clearStage(){
  cleared++;st='clear';tm=0;gain=100+stage*20+Math.round(Math.max(0,T-t)*10)+Math.round(risk*60);score+=gain;
  burst(58,SC.gy-30,['🎉','✨','🥳','🍻'],12);beep(880,.25,'triangle');setTimeout(()=>beep(1175,.3,'triangle'),120);
  if(navigator.vibrate)navigator.vibrate(20);
}
function fail(kind){
  endKind=kind;st='caught';tm=0;shake=RM?0:14;flash=1;
  why=kind==='caught'?TH.bn+': '+pick(TH.caught):'🕕 6시 땡! 야근 시작… 🌙';
  burst(58,SC.gy-30,kind==='caught'?['💢','😱','💦']:['🌙','😭','💤'],10);
  beep(130,.45,'sawtooth');if(navigator.vibrate)navigator.vibrate(80);
  $('pb').classList.add('hide');
}
function showOver(){
  st='over';overAt=performance.now();V.games++;newBest=score>V.bestScore;if(newBest)V.bestScore=score;if(cleared>V.best)V.best=cleared;save();
  const k=ti(cleared);
  $('ot').textContent=(newBest&&score>0?'🎉 신기록! ':'')+TI[k][1];
  $('os').textContent=score.toLocaleString('ko-KR')+'점';
  $('oq').textContent=why;
  $('ob').textContent='칼퇴 '+cleared+'번 · 최고 '+V.bestScore.toLocaleString('ko-KR')+'점 · '+V.games+'판';
  $('over').classList.remove('hide');
}
function menu(){
  st='menu';paused=false;holds.clear();
  ['pz','over'].forEach(i=>$(i).classList.add('hide'));$('pb').classList.add('hide');$('menu').classList.remove('hide');
  $('ms').textContent=V.bestScore?'최고 '+V.bestScore.toLocaleString('ko-KR')+'점 · 칼퇴 최고 '+V.best+'번 · '+V.games+'판':'';
}
function pause(){if(!['ready','play'].includes(st)||paused)return;paused=true;holds.clear();$('pz').classList.remove('hide')}
function resume(){paused=false;$('pz').classList.add('hide')}

/* input: hold to run */
cv.addEventListener('pointerdown',e=>{e.preventDefault();holds.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(x){}});
const rel=e=>{holds.delete(e.pointerId)};
addEventListener('pointerup',rel);addEventListener('pointercancel',rel);addEventListener('blur',()=>holds.clear());
cv.addEventListener('lostpointercapture',rel);
let kd=false;
addEventListener('keydown',e=>{
  if((e.code==='Space'||e.code==='Enter')&&!e.repeat&&(paused||st==='menu'||(st==='over'&&performance.now()-overAt>700))){e.preventDefault();if(e.code==='Space')kd=true;paused?resume():startGame();return}
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!kd){kd=true;holds.add('k')}}
  else if(e.code==='Escape'||e.code==='KeyP'){paused?resume():pause()}
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'){kd=false;holds.delete('k')}});
$('go').onclick=startGame;$('re').onclick=startGame;$('qm').onclick=menu;$('mn').onclick=menu;
$('pb').onclick=pause;$('rs').onclick=resume;
$('sh').onclick=async()=>{
  const tx='칼퇴 러쉬에서 '+score.toLocaleString('ko-KR')+'점! ('+cleared+'번 칼퇴) '+TI[ti(cleared)][1]+'\n너는 부장님 눈 피할 수 있어? 👉 ';

  else{await navigator.clipboard.writeText(tx+location.href);$('sh').textContent='복사됨 ✅';setTimeout(()=>$('sh').textContent='공유하기',1500)}}catch(e){}

['gesturestart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));

function update(dt){
  if(st==='ready'){tm+=dt;if(tm>1.1)st='play'}
  else if(st==='play'){
    moving=holds.size>0;
    t+=dt;
    if(moving){dustT+=dt;if(dustT>.05){dustT=0;dust.push({x:46,y:SC.gy+3,vx:-70-Math.random()*50,vy:-18-Math.random()*22,l:1,r:2.5+Math.random()*3})}prog+=SPEED*(boost>0?1.7:1)*dt;stepT+=dt;if(stepT>.18){stepT=0;beep(200+Math.random()*40,.04,'square')}}
    if(boost>0)boost-=dt;
    const wx=prog*(D-60);for(const it of items)if(!it.got&&wx>=it.x-8){it.got=true;grab(it.e)}
    if(moving&&bs==='warn'){risk+=dt;if(Math.random()<dt*8)burst(58,SC.gy-30,['🔥'],1)}
    bt+=dt;
    if(bt>=bd){
      if(bs==='away'){setB('warn');beep(520,.12,'square');if(navigator.vibrate)navigator.vibrate(10)}
      else if(bs==='warn'){if(fake){fakeT=1.1;setB('away');bd=Math.max(bd,1.0)}else{setB('watch');beep(240,.2,'sawtooth')}}
      else{setB('away');if(stage>=6&&Math.random()<.25)bd=.45}
    }
    if(fakeT>0)fakeT-=dt;
    if(bs==='watch'&&moving&&bt>.12){
      if(shield){shield=false;pop('🎫 연차 사용! 무사통과','#7dd3fc');flash=.6;beep(300,.2,'square');setB('away');bd=Math.max(bd,1.3);if(navigator.vibrate)navigator.vibrate(30)}
      else{fail('caught');return}
    }
    if(prog>=1){clearStage();return}
    if(t>=T){fail('time');return}
  }else if(st==='clear'){tm+=dt;if(tm>.9){stage++;startStage()}}
  else if(st==='caught'){tm+=dt;if(tm>1){showOver()}}
  for(const q of parts){q.vy+=12*dt;q.x+=q.vx*dt*60;q.y+=q.vy*dt*60;q.l-=dt*1.3}
  parts=parts.filter(q=>q.l>0);
  for(const q of fl){q.y-=dt*38;q.l-=dt*.8}fl=fl.filter(q=>q.l>0);
  for(const q of dust){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*2.6}
  dust=dust.filter(q=>q.l>0);
  if(shake>0)shake=RM?0:Math.max(0,shake-dt*30);
  if(flash>0)flash=RM?0:Math.max(0,flash-dt*2.2);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function txt(tx,x,y,font,col,al){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.fillText(tx,x,y)}
function mixA(k){
  let i=0;while(i<SKY.length-2&&k>SKY[i+1][0])i++;
  const A=SKY[i],B=SKY[i+1],f=Math.min(1,Math.max(0,(k-A[0])/(B[0]-A[0])));
  return [0,1,2].map(j=>Math.round(A[1][j]+(B[1][j]-A[1][j])*f));
}
function skyRGB(k){
  if(TH.sky==='space')return [10,13,36];
  let c=mixA(k);
  if(TH.sky==='snow')c=c.map((v,j)=>Math.round(v*.45+[235,245,255][j]*.55));
  return c;
}
const rgb=(c,a)=>(a==null?'rgb(':'rgba(')+c.join(',')+(a==null?')':','+a+')');
const bl=(c,w,m)=>c.map((v,j)=>Math.round(v*(1-m)+w[j]*m));

const Z=.74,PXS=58,BXS=304;
const fz=(n,w)=>(w||'800')+' '+Math.round(n/Z)+'px sans-serif';
const leftStr=k=>{const q=Math.max(0,Math.round(600*(1-k)));return String(Math.floor(q/60)).padStart(2,'0')+':'+String(q%60).padStart(2,'0')};

      ctx.fillStyle=wg;rr(wx+18,wy,104,wh,5);ctx.fill();

  const dx=PX+D-scroll;
  if(dx<560){
    const dw=62,dh=108,dtop=gY-dh;

    ctx.fillStyle='#4a3120';rr(dx-dw/2-6,dtop-6,dw+12,dh+6,6);ctx.fill();
    ctx.fillStyle='#8a5e3b';rr(dx-dw/2,dtop,dw,dh,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(dx-dw/2+4,dtop+6,dw/2-6,dh-12);

  if(moving&&st==='play'){ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.lineCap='round';for(let i=0;i<3;i++){const ly=gY-14-i*12,lx=PXS-26-((t*420+i*30)%30);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(lx-16,ly);ctx.stroke()}}
  if(TH.sky==='snow'){ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<26;i++){const fx=10+(((i*37+t*14+Math.sin(t+i)*8)%340)+340)%340,fy=top+(((i*61+t*(30+i%5*8))%SC.h)+SC.h)%SC.h;ctx.beginPath();ctx.arc(fx,fy,1.2+i%3*.5,0,7);ctx.fill()}}
  if(TH.sky!=='space'){const wm=Math.max(0,(k-.35)/.65);ctx.fillStyle='rgba(255,110,40,'+(.18*wm).toFixed(3)+')';ctx.fillRect(10,top,340,SC.h)}
